# Fix: Windows remote 10.23.23.22 — pin the remote command shell to the real
# Git Bash. Auto-detection runs cmd /c where bash, whose FIRST hit is
# C:\Windows\System32\bash.exe (the WSL launcher, which rejects ash -s),
# so the probe never reaches the C:\Program Files\Git\bin\bash.exe fallback.
- id: dsh-remote
  name: dsh-remote
  config:
    shell: 'C:\Program Files\Git\bin\bash.exe'
